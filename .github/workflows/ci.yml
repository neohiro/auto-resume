name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      soft: ${{ steps.decide.outputs.soft }}
    steps:
      - name: Decide enforcement mode
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          MSG: ${{ github.event.head_commit.message }}
          AUTHOR: ${{ github.event.head_commit.author.name }}
          COMMITTER: ${{ github.event.head_commit.committer.name }}
          AGENT_ACTORS: ${{ vars.AGENT_ACTORS }}
        run: |
          soft=false
          if [ "$EVENT" = "push" ]; then
            case "$MSG" in *"[oc]"*|*"[skip-email]"*) soft=true;; esac
            if [ "$AUTHOR" = "OpenCode Agent" ]; then soft=true; fi
            if [ "$COMMITTER" = "OpenCode Agent" ]; then soft=true; fi
            if [ "$ACTOR" = "opencode-agent" ]; then soft=true; fi
            if [ -n "$AGENT_ACTORS" ]; then
              case ",$AGENT_ACTORS," in *",$ACTOR,"*) soft=true;; esac
            fi
          fi
          echo "soft=$soft"
          echo "soft=$soft" >> "$GITHUB_OUTPUT"
  test:
    needs: triage
    continue-on-error: ${{ needs.triage.outputs.soft == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Verify version consistency
        run: node scripts/check-version.cjs
      - name: Run test suites
        run: npm test
